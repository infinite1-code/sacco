{% extends 'base.html' %}
{% block content %}



<div class="container">
    <div class="row">
        <div class="col-6">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3853.806420797586!2d36.802106699999996!3d-1.2653048999999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182f17fc74beaa35%3A0x1db1299ba63a51cf!2sOne%20Africa%20Place!5e1!3m2!1sen!2ske!4v1771231958838!5m2!1sen!2ske" width="600" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <div class="col-6">
        <form action="/action_page.php" class="p-4 border rounded shadow-sm" style="max-width: 500px; margin: auto; background-color: #f9f9f9;">
  <h3 class="mb-4 text-center">Contact Us</h3>

  <!-- Name -->
  <div class="mb-3">
    <label for="name" class="form-label">Name:</label>
    <input type="text" class="form-control" id="name" placeholder="Enter your name" name="name" required>
  </div>

  <!-- Email -->
  <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control" id="email" placeholder="Enter your email" name="email" required>
  </div>

  <!-- Description -->
  <div class="mb-3">
    <label for="description" class="form-label">Description:</label>
    <textarea class="form-control" id="description" placeholder="Write your message here..." name="description" rows="5" required></textarea>
  </div>

  <!-- Submit button -->
  <div class="text-center">
    <button type="submit" class="btn btn-primary px-5">Submit</button>
  </div>
</form>

        </div>
